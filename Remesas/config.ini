[application]
name=Liquidaciones - Remesas
mode=POSTGRESQL
window_width=1450
window_height=900

[logging]
file=C:\Liquidaciones\Remesas\logs\remesas.log
level=INFO

[hectare_fee]
surface_crops=CITRICOS,MANDARINA
price_per_hectare=195
delivery_crops=CITRICOS,MANDARINA,DIRECTO,DIRECTOCHF,INDUSTRIA
applicable_remittance_crops=CITRICOS,MANDARINA,DIRECTO,DIRECTOCHF,INDUSTRIA

[AUDIT]
enabled = true

[persistence]
enabled=true

[database_backend]
backend = postgresql

[postgresql]
host = 192.168.1.3
port = 5432
database = perceco
user = perceco_engine
sslmode = prefer
connect_timeout = 5
application_name = liquidaciones_remesas
min_pool_size = 1
max_pool_size = 10
